{% extends "emails/base.html" %}
{% block preheader %}{{ headline }}{% endblock %}
{% block content %}
<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;">{{ headline }}</h1>
{% for line in lines %}<p style="margin:0 0 10px 0;">{{ line }}</p>{% endfor %}
<p style="margin:18px 0 0 0;"><a href="{{ site_url }}{{ link }}" style="display:inline-block;background:#0b192c;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;">Open the staff panel</a></p>
<p style="margin:12px 0 0 0;font-size:13px;color:#64748b;">{{ site_url }}{{ link }}</p>
{% endblock %}
