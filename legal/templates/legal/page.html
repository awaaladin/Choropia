<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} | Choropia</title>
<style>
  body{font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#fafafa;color:#1a1c1e}
  main{max-width:720px;margin:0 auto;padding:24px 16px 64px}
  h1{font-size:28px;line-height:1.25;margin:8px 0 4px}
  h2{font-size:19px;margin:32px 0 6px}
  .meta{color:#5b6066;font-size:14px;margin-bottom:24px}
  a{color:#426086}
  @media (prefers-color-scheme: dark){body{background:#101214;color:#e6e8ea}.meta{color:#9aa0a6}a{color:#9bbbe6}}
</style>
</head>
<body>
<main>
<h1>{{ title }}</h1>
<p class="meta">Version {{ version }}</p>
{{ body|safe }}
</main>
</body>
</html>
