# Runs Choropia's background jobs every 5 minutes: confirm waiting payments, auto-release escrow,
# send seller payouts and reconcile transfers. Vercel's free plan only allows a daily cron, so this
# is what keeps payouts prompt. Needs a repository secret named CRON_SECRET (the same value as the
# CRON_SECRET environment variable on the Vercel project).
name: scheduled-jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the jobs endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set"; exit 1; fi
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://choropia.vercel.app/api/v1/internal/jobs/run/
