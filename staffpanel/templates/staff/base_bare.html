{% load staff_extras %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}Staff{% endblock %} · Choropia</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(0.955 0.012 250);--fg:oklch(0.205 0.035 257);--card:oklch(0.995 0.004 250);--muted:oklch(0.968 0.007 247.9);
  --muted-fg:oklch(0.48 0.045 255);--primary:oklch(0.455 0.12 254);--primary-hover:oklch(0.365 0.105 254);--primary-fg:oklch(0.985 0.004 250);
  --border:oklch(0.33 0.055 255 / .14);--danger:oklch(0.577 0.245 27.3);--ok:oklch(0.59 0.13 171);--warn:oklch(0.72 0.14 75);
  --side:oklch(0.205 0.035 257);--side-fg:oklch(0.9 0.02 250);--shadow:0 3px 10px oklch(0.25 0.06 255 / .1);
}
@media (prefers-color-scheme: dark){:root{
  --bg:oklch(0.145 0.032 255);--fg:oklch(0.984 0.003 247.9);--card:oklch(0.208 0.042 265.8);--muted:oklch(0.279 0.041 260);
  --muted-fg:oklch(0.75 0.03 255);--primary:oklch(0.68 0.11 250);--primary-hover:oklch(0.74 0.095 250);--primary-fg:oklch(0.16 0.035 255);
  --border:oklch(0.9 0.02 250 / .14);--side:oklch(0.17 0.034 258);--shadow:none;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Manrope",system-ui,sans-serif}
h1,h2,h3{font-family:"Sora","Manrope",sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font:600 18px "Sora",sans-serif;color:#fff}
.brand img{height:28px;width:auto;border-radius:6px}
.side a.nav{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--side-fg);font-weight:500}
.side a.nav:hover{background:oklch(1 0 0 / .07);text-decoration:none}
.side a.nav.on{background:oklch(1 0 0 / .13);color:#fff}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px;font-weight:700}
.side .who{margin-top:auto;padding:12px;border-top:1px solid oklch(1 0 0 / .12);font-size:13px;color:oklch(0.8 0.02 250)}
.side form button{background:none;border:0;color:inherit;padding:0;font:inherit;text-decoration:underline;cursor:pointer}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sub{color:var(--muted-fg);margin:4px 0 0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:22px}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin-bottom:12px}
.kpi .label{color:var(--muted-fg);font-size:13px;font-weight:600}
.kpi .value{font:600 26px "Sora",sans-serif;margin-top:4px}
.kpi .note{color:var(--muted-fg);font-size:12.5px;margin-top:2px}
.kpi.alert{border-color:oklch(0.577 0.245 27.3 / .5)}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted-fg);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--muted)}
.right{text-align:right}.mono{font-variant-numeric:tabular-nums}.small{font-size:13px;color:var(--muted-fg)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:oklch(0.59 0.13 171 / .16);color:oklch(0.42 0.11 171)}
.pill.warn{background:oklch(0.78 0.14 80 / .22);color:oklch(0.48 0.1 70)}
.pill.bad{background:oklch(0.577 0.245 27.3 / .14);color:oklch(0.5 0.2 27)}
.pill.plain{background:var(--muted);color:var(--muted-fg)}
@media (prefers-color-scheme: dark){.pill.good{color:oklch(0.82 0.11 171)}.pill.warn{color:oklch(0.86 0.12 85)}.pill.bad{color:oklch(0.78 0.15 27)}}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs a{padding:7px 14px;border-radius:99px;border:1px solid var(--border);color:var(--fg);font-weight:600;font-size:14px;background:var(--card)}
.tabs a.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tabs a:hover{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--primary);background:var(--primary);color:var(--primary-fg);padding:10px 18px;border-radius:12px;font:600 14px "Manrope",sans-serif;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,background .12s ease,box-shadow .12s ease}
.btn:hover{background:var(--primary-hover);text-decoration:none;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid oklch(0.68 0.11 250 / .45);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--border);box-shadow:none}
.btn.ghost:hover{background:var(--muted)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.good{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.good:hover{background:oklch(0.52 0.13 171)}
.btn.small{padding:7px 13px;font-size:13px;border-radius:10px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit;transition:border-color .12s ease,box-shadow .12s ease,background .12s ease}
input::placeholder,textarea::placeholder{color:var(--muted-fg);opacity:.75}
input[type=text]:focus,input[type=email]:focus,input[type=password]:focus,input[type=search]:focus,input[type=number]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);background:var(--card);box-shadow:0 0 0 4px oklch(0.68 0.11 250 / .2)}
textarea{min-height:92px;resize:vertical;line-height:1.5}
label{display:block;font-weight:600;font-size:13.5px;margin:14px 0 6px}
/* inbox cards */
.tabs a .count{display:inline-block;margin-left:7px;min-width:20px;padding:0 6px;border-radius:99px;background:oklch(0.5 0.1 255 / .16);font-size:12px;font-weight:700;text-align:center}
.tabs a.on .count{background:oklch(1 0 0 / .25)}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-title h2{margin:0}
.section-title .pill{font-size:12px}
.item{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px "Sora",sans-serif;color:var(--primary-fg);background:linear-gradient(135deg,var(--primary),oklch(0.55 0.1 200))}
.avatar.shop{border-radius:14px;background:linear-gradient(135deg,oklch(0.6 0.13 171),oklch(0.5 0.1 200))}
.avatar.flag{background:linear-gradient(135deg,oklch(0.65 0.18 40),oklch(0.55 0.2 27))}
.item-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.item-head strong{font:600 16px "Sora",sans-serif}
.item .meta{color:var(--muted-fg);font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:var(--muted);color:var(--fg);border-radius:10px;padding:5px 11px;font-size:13px;font-weight:600}
.quote{margin-top:12px;padding:12px 14px;background:var(--muted);border-radius:12px;white-space:pre-wrap;border-left:3px solid var(--primary)}
.quote.reply{border-left-color:var(--ok)}
.quote small{display:block;color:var(--muted-fg);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
details.more{margin-top:12px}
details.more>summary{cursor:pointer;list-style:none;display:inline-flex;font-weight:600;font-size:13.5px;color:var(--primary);padding:6px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:4px}
.panel-form{margin-top:10px;padding:14px;border:1px dashed var(--border);border-radius:14px}
.empty-state{text-align:center;padding:34px 16px;background:var(--card);border:1px dashed var(--border);border-radius:18px;color:var(--muted-fg)}
.empty-state strong{display:block;color:var(--fg);font:600 16px "Sora",sans-serif;margin-bottom:4px}
.note-saved{font-size:12.5px;color:var(--muted-fg);margin-top:6px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--muted)}
.item-link{color:inherit}
.item-link:hover{text-decoration:underline}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.fact{background:var(--muted);border-radius:14px;padding:12px 14px}
.fact small{display:block;color:var(--muted-fg);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px;margin-bottom:4px}
/* mail list + conversation */
.mail-list{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.mail-row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);color:var(--fg);transition:background .12s ease}
.mail-row:last-child{border-bottom:0}
.mail-row:hover{background:var(--muted);text-decoration:none}
.mail-row.unread .mail-top strong{font-weight:800}
.mail-row.unread{background:oklch(0.5 0.12 255 / .06)}
.mail-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mail-preview{color:var(--muted-fg);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mail-main{min-width:0}
.mail-time{color:var(--muted-fg);font-size:12.5px;white-space:nowrap}
.thread-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.thread{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.bubble{max-width:720px;border-radius:18px;padding:14px 18px;border:1px solid var(--border)}
.bubble.them{background:var(--card);align-self:flex-start;border-top-left-radius:6px}
.bubble.us{background:oklch(0.5 0.12 255 / .12);align-self:flex-end;border-top-right-radius:6px;border-color:oklch(0.5 0.12 255 / .25)}
.bubble-meta{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--muted-fg);margin-bottom:6px}
.bubble-meta strong{color:var(--fg);font-size:13.5px}
.bubble-text{white-space:pre-wrap}
.composer{margin-top:18px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
@media (max-width:860px){.mail-row{grid-template-columns:40px 1fr}.mail-time{display:none}.bubble{max-width:100%}}
.search{display:flex;gap:8px;margin-bottom:16px;max-width:520px}
.msg{padding:11px 14px;border-radius:12px;margin-bottom:14px;font-weight:500}
.msg.success{background:oklch(0.59 0.13 171 / .15)}.msg.error{background:oklch(0.577 0.245 27.3 / .14)}
dl{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;margin:0}dt{color:var(--muted-fg);font-weight:600}dd{margin:0}
.secret{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.04em;background:var(--muted);padding:10px 14px;border-radius:10px;display:inline-block}
.empty{color:var(--muted-fg);padding:18px 4px}
.timeline{list-style:none;margin:0;padding:0}.timeline li{padding:8px 0 8px 18px;border-left:2px solid var(--border);position:relative}
.timeline li:before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.warnbox{border:1px solid oklch(0.78 0.14 80 / .6);background:oklch(0.78 0.14 80 / .14);padding:12px 14px;border-radius:12px;margin-bottom:16px}
@media (max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .who{margin:0;border:0}.brand{padding:4px 8px}.two{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
