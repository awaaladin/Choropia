{% extends "core/base.html" %}
{% block title %}Profile — Choropia{% endblock %}

{% block content %}
<div id="profile-root" class="card p-6 max-w-md">
  <p class="text-outline">Loading&hellip;</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
  async function loadProfile() {
    const root = document.getElementById("profile-root");
    if (!Choropia.isAuthenticated()) {
      window.location.href = "{% url 'login' %}";
      return;
    }
    try {
      const user = await Choropia.me();
      const profile = user.profile || {};

      root.innerHTML = `
        <h1 class="text-xl font-bold mb-4">Your profile</h1>
        <form id="profile-form" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <input type="text" name="first_name" value="${user.first_name || ""}" placeholder="First name" class="input-field" />
            <input type="text" name="last_name" value="${user.last_name || ""}" placeholder="Last name" class="input-field" />
          </div>
          <input type="text" name="phone_number" value="${user.phone_number || ""}" placeholder="Phone number" class="input-field" />
          <textarea name="bio" placeholder="Bio" rows="2" class="input-field">${profile.bio || ""}</textarea>
          <input type="text" name="location" value="${profile.location || ""}" placeholder="Location" class="input-field" />
          <div>
            <label class="block text-sm font-medium mb-1">Theme</label>
            <select name="theme_preference" class="input-field">
              <option value="light" ${profile.theme_preference === "light" ? "selected" : ""}>Light</option>
              <option value="dark" ${profile.theme_preference === "dark" ? "selected" : ""}>Dark</option>
            </select>
          </div>
          <p id="profile-error" class="text-sm text-red-500 hidden"></p>
          <p id="profile-success" class="text-sm text-green-600 hidden">Saved.</p>
          <button type="submit" class="btn-primary w-full">Save changes</button>
        </form>
        <p class="text-sm text-outline mt-4">${user.email}</p>
        <a href="/merchants/apply/" class="text-sm text-secondary font-medium mt-2 inline-block hover:underline">Become a merchant &rarr;</a>
      `;

      document.getElementById("profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorEl = document.getElementById("profile-error");
        const successEl = document.getElementById("profile-success");
        errorEl.classList.add("hidden");
        successEl.classList.add("hidden");

        const form = new FormData(e.target);
        const payload = {
          first_name: form.get("first_name"),
          last_name: form.get("last_name"),
          phone_number: form.get("phone_number") || null,
          profile: {
            bio: form.get("bio"),
            location: form.get("location"),
            theme_preference: form.get("theme_preference"),
          },
        };
        try {
          await Choropia.updateProfile(payload);
          successEl.classList.remove("hidden");

          const nowDark = payload.profile.theme_preference === "dark";
          document.documentElement.classList.toggle("dark", nowDark);
          try {
            localStorage.setItem("choropia_theme", nowDark ? "dark" : "light");
          } catch (e) {}
          if (typeof refreshThemeIcon === "function") refreshThemeIcon();
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.remove("hidden");
        }
      });
    } catch (err) {
      root.innerHTML = `<p class="text-red-500">${err.message}</p>`;
    }
  }
  loadProfile();
</script>
{% endblock %}
