{% extends "core/base.html" %}
{% block title %}Sell on Choropia{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto card p-6">
  <h1 class="text-xl font-bold mb-4">Post a listing</h1>
  <form id="create-listing-form" class="space-y-3" enctype="multipart/form-data">
    <div>
      <label class="block text-sm font-medium mb-1">Title</label>
      <input type="text" name="title" required class="input-field" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Description</label>
      <textarea name="description" rows="3" class="input-field"></textarea>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">Price (₦)</label>
        <input type="number" name="price" step="0.01" required class="input-field" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Condition</label>
        <select name="condition" class="input-field">
          <option value="used">Used</option>
          <option value="new">New</option>
        </select>
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Category</label>
      <select name="category" required class="input-field"></select>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Location</label>
      <input type="text" name="location" placeholder="e.g. Uyo — Use of Ibom campus" class="input-field" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Photos</label>
      <input type="file" name="uploaded_photos" accept="image/*" multiple class="input-field" />
    </div>
    <p id="create-listing-error" class="text-sm text-red-500 hidden"></p>
    <button type="submit" class="btn-primary w-full">Post listing</button>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
  if (!Choropia.isAuthenticated()) window.location.href = "{% url 'login' %}";

  const form = document.getElementById("create-listing-form");
  const errorEl = document.getElementById("create-listing-error");

  async function loadCategories() {
    const select = form.querySelector("select[name=category]");
    try {
      const categories = await Choropia.listCategories();
      categories.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
    } catch (err) {
      errorEl.textContent = "Could not load categories: " + err.message;
      errorEl.classList.remove("hidden");
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.classList.add("hidden");
    const formData = new FormData(form);
    try {
      const listing = await Choropia.createListing(formData);
      window.location.href = `/listings/${listing.id}/`;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("hidden");
    }
  });

  loadCategories();
</script>
{% endblock %}
